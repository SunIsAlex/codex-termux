<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Codex</title><link rel="stylesheet" href="/style.css"></head>
<body><header><button id="historyButton" aria-label="历史会话">☰</button><strong>Codex</strong><label class="model-picker"><span>模型</span><select id="model" aria-label="选择模型" disabled><option value="">默认模型</option></select></label><span id="connection">连接中</span><button id="settingsButton">项目与设置</button></header>
<aside id="history" hidden><h2>历史会话</h2><button id="newThread">新会话</button><div id="threads"></div><button id="more">加载更多</button></aside>
<section id="settings" hidden><label>Termux 项目目录<input id="cwd" placeholder="/data/data/com.termux/files/home/project" list="recent"></label><datalist id="recent"></datalist><button id="project">在此目录新建会话</button><p id="modelDescription">模型将在连接后加载。</p><section aria-label="账户用量"><h2>Usage</h2><button id="usageRefresh" type="button">刷新用量</button><div id="usageData"></div><p id="resetCount">可用 reset：尚未读取</p><label>Reset<select id="resetCredit"></select></label><button id="redeemReset" type="button" disabled>Redeem reset</button><p id="usageStatus" role="status"></p></section><p id="permissions">权限：沿用 Codex 配置</p><button id="cleanup">清理全部上传图片</button><p>清理后历史图片不可用。浏览器退出不停止任务；Android 杀死 Termux 后任务可能终止。</p></section>
<main id="messages" aria-label="聊天记录"></main><section id="requests" aria-live="polite"></section><p id="error" role="alert"></p>
<footer><label class="effort-picker">Effort<select id="effort" aria-label="推理强度" disabled><option value="">沿用会话 / 配置</option></select></label><div id="images"></div><form id="composer"><label class="attach" aria-label="添加图片">＋<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label><textarea id="prompt" rows="2" placeholder="描述任务，或添加图片…" aria-label="Prompt"></textarea><button id="send" type="submit">发送</button><button id="stop" type="button" hidden>停止</button></form></footer><script type="module" src="/app.js"></script></body></html>
